<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're offline</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#0B1D3A;color:#F8F5F0;font-family:Inter,sans-serif;text-align:center;padding:24px;}
    h1{font-family:'Cormorant Garamond',serif;font-size:2rem;color:#E8C97A;margin-bottom:8px;}
    p{color:#cbd0dc;max-width:360px;line-height:1.6;}
    a{color:#E8C97A;text-decoration:none;}
  </style>
</head>
<body>
  <h1 id="store-name">Our Store</h1>
  <p id="store-msg">You're offline. Reconnect to browse our collection.</p>
  <script>
    try {
      var name  = localStorage.getItem('ao_store_name');
      var phone = localStorage.getItem('ao_store_phone');
      if (name)  document.getElementById('store-name').textContent = name;
      if (phone) {
        document.getElementById('store-msg').innerHTML =
          "You\u2019re offline. Reconnect to browse our collection, or call us at <a href=\"tel:" +
          phone.replace(/\s/g,'') + "\">" + phone + "</a>.";
      }
    } catch(e) {}
  </script>
</body>
</html>
